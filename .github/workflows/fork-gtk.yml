name: Fork GTK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-gtk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gtk:
    if: github.repository == 'gaborbernat/ghostty'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Test GTK
        run: nix develop --accept-flake-config -c zig build -Dapp-runtime=gtk -Dgtk-x11=true -Dgtk-wayland=true test
      - name: Build GTK
        run: nix develop --accept-flake-config -c zig build -Dapp-runtime=gtk -Dgtk-x11=true -Dgtk-wayland=true
